name: Release
on:
  push:
    branches: [master]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read and bump version
        id: bump
        run: |
          VERSION=$(grep "^APP_VERSION" main.py | grep -oP '"\K[^"]+')
          echo "Current APP_VERSION: $VERSION"

          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            IFS='.' read -r MAJ MIN PATCH <<< "$VERSION"
            NEW_VERSION="$MAJ.$MIN.$((PATCH + 1))"
            echo "Tag v$VERSION exists. Auto-bumping to $NEW_VERSION"
            sed -i "s/^APP_VERSION = \"$VERSION\"/APP_VERSION = \"$NEW_VERSION\"/" main.py
            git config user.name "github-actions"
            git config user.email "github-actions@github.com"
            git add main.py
            git commit -m "bump version to v$NEW_VERSION [skip ci]"
            git push origin master
            echo "tag=v$NEW_VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "Tag v$VERSION does not exist. Using as-is."
            echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          fi

      - name: Create tag
        run: |
          git tag "${{ steps.bump.outputs.tag }}"
          git push origin "${{ steps.bump.outputs.tag }}"

  build:
    needs: release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pyinstaller openpyxl
      - name: Build executable
        run: |
          pyinstaller --onefile --windowed --name TableGenerator `
            --hidden-import openpyxl.cell._writer `
            --collect-submodules openpyxl `
            main.py
      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ needs.release.outputs.tag }}" `
            --repo "${{ github.repository }}" `
            --generate-notes `
            dist/TableGenerator.exe main.py
